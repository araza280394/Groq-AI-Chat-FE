<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ali Raza's AI Chat UI</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        padding: 15px;
        background: #111827;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1f2937;
      }

      .buttons button {
        margin-left: 10px;
        padding: 6px 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        background: #2563eb;
        color: white;
        font-size: 12px;
      }

      #chat {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 70%;
        padding: 10px 12px;
        border-radius: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
      }

      .user {
        align-self: flex-end;
        background: #2563eb;
        color: white;
      }

      .bot {
        align-self: flex-start;
        background: #1f2937;
      }

      .system {
        align-self: center;
        background: #7c2d12;
        color: #fef3c7;
        font-size: 12px;
      }

      .input-area {
        display: flex;
        padding: 10px;
        border-top: 1px solid #1f2937;
        background: #111827;
      }

      input {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        outline: none;
        background: #1f2937;
        color: white;
      }

      button.send {
        margin-left: 10px;
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: white;
        cursor: pointer;
      }

      button.send:disabled {
        background: #374151;
        cursor: not-allowed;
      }

      .typing {
        font-style: italic;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>🚀 Ali Raza's AI Chat UI</h1>
      <div class="buttons">
        <button onclick="ping()">Ping</button>
        <button onclick="clearChat()">Clear</button>
      </div>
    </header>

    <div id="chat"></div>

    <div class="input-area">
      <input
        id="input"
        placeholder="Type your message..."
        onkeydown="handleKey(event)"
      />
      <button id="sendBtn" class="send" onclick="sendMessage()">Send</button>
    </div>

    <script>
      const API_BASE = "https://groq-ai-chat.onrender.com/api/v1/chat";

      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("sendBtn");

      // 🔥 CONFIG
      const COOLDOWN = 3000; // 3 sec
      const MAX_PER_MINUTE = 8;

      let lastRequestTime = 0;
      let requests = [];
      let isSending = false;

      const funkyMessages = [
        "Whoa there, speedster 🚀 chill a bit!",
        "Too fast! Even AI needs coffee ☕",
        "Spam detected 😏 take a breath!",
        "Easy tiger 🐅 give it a second...",
        "You're typing like a hacker 😂 slow down!",
      ];

      function randomMsg() {
        return funkyMessages[Math.floor(Math.random() * funkyMessages.length)];
      }

      function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }

      function setTyping(show) {
        let existing = document.getElementById("typing");

        if (show) {
          if (!existing) {
            const div = document.createElement("div");
            div.id = "typing";
            div.className = "msg bot typing";
            div.innerText = "🤖 AI is thinking...";
            chat.appendChild(div);
          }
        } else {
          if (existing) existing.remove();
        }

        chat.scrollTop = chat.scrollHeight;
      }

      function canSend() {
        const now = Date.now();

        // cooldown check
        if (now - lastRequestTime < COOLDOWN) {
          const wait = ((COOLDOWN - (now - lastRequestTime)) / 1000).toFixed(1);
          addMessage(`⏳ Wait ${wait}s... ${randomMsg()}`, "system");
          return false;
        }

        // per-minute limit
        requests = requests.filter((t) => now - t < 60000);

        if (requests.length >= MAX_PER_MINUTE) {
          addMessage("🚫 Too many messages! Try again in a minute.", "system");
          return false;
        }

        requests.push(now);
        lastRequestTime = now;
        return true;
      }

      async function sendMessage() {
        if (isSending) {
          addMessage(
            "🤖 Hey! I'm still working on your last request 😅",
            "system",
          );
          return;
        }

        if (!canSend()) return;

        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";

        isSending = true;
        input.disabled = true;
        sendBtn.disabled = true;

        setTyping(true);

        try {
          const res = await fetch(`${API_BASE}/completions`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });

          const data = await res.json();

          const reply =
            data?.message ||
            data?.choices?.[0]?.message?.content ||
            JSON.stringify(data);

          setTyping(false);
          addMessage(reply, "bot");
        } catch (err) {
          setTyping(false);
          addMessage("💥 Server ghosted us... try again!", "system");
        } finally {
          isSending = false;
          input.disabled = false;
          sendBtn.disabled = false;
        }
      }

      async function ping() {
        try {
          const res = await fetch(`${API_BASE}/ping`);
          const data = await res.json();

          const reply = data?.message || JSON.stringify(data);

          addMessage("🏓 PING → " + reply, "bot");
        } catch (err) {
          addMessage("❌ Ping failed", "system");
        }
      }

      function clearChat() {
        chat.innerHTML = "";
        requests = [];
      }

      function handleKey(e) {
        if (e.key === "Enter") sendMessage();
      }
    </script>
  </body>
</html>
